<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ĐỌC VỊ</title>
<meta name="description" content="Trò chơi đọc vị hai người trên một máy.">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ĐỌC VỊ">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="js/boot.js?v=7"></script>
<link rel="stylesheet" href="css/app.css?v=7">
<script defer src="js/rules.js?v=7"></script>
<script defer src="js/audio.js?v=7"></script>
<script defer src="js/fx.js?v=7"></script>
<script defer src="js/app.js?v=7"></script>
</head>
<body>
<div id="app" class="app">
  <header class="hud" id="hud">
    <div class="hud-l">
      <button class="hud-btn" id="btnHome" type="button" aria-label="Về màn hình đầu"></button>
      <span class="hud-round mono" id="roundLabel">VÁN 01</span>
    </div>
    <div class="hud-steps" id="steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="hud-r">
      <button class="hud-btn" id="btnFull" type="button" aria-label="Toàn màn hình" hidden></button>
      <button class="hud-btn" id="btnMute" type="button" aria-label="Tắt tiếng"></button>
    </div>
  </header>
  <main class="stage" id="stage"></main>
  <div class="layer peek" id="peekLayer" hidden></div>
  <div class="layer wipe" id="wipe" aria-hidden="true"></div>
  <div class="layer flash" id="flash" aria-hidden="true"></div>
  <div class="edges" id="edges" aria-hidden="true"><i class="e-t"></i><i class="e-b"></i><i class="e-l"></i><i class="e-r"></i></div>
  <div class="layer recover" id="recover" hidden>
    <div class="recover-box">
      <div class="mono lbl">SỰ CỐ</div>
      <div class="recover-t">CÓ LỖI</div>
      <button class="btn btn-primary" id="recResume" type="button">Tiếp tục</button>
      <button class="btn" id="recNew" type="button">Ván mới</button>
    </div>
  </div>
</div>
<noscript><p style="color:#F2EFE6;font:700 20px sans-serif;padding:24px">Cần bật JavaScript.</p></noscript>
</body>
</html>
